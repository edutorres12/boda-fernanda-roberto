<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="utf-8">
  <title>Página no encontrada | Juan &amp; Nancy</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta content="noindex" name="robots">
  <meta content="#3f4720" name="theme-color">
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/webflow.css" rel="stylesheet" type="text/css">
  <link href="css/template-clasico-a425c7c38fab1c4cb49ecb.webflow.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
  <script type="text/javascript">WebFont.load({ google: { families: ["Montserrat:400", "Libre Caslon Display:regular"] } });</script>
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="images/webclip.png" rel="apple-touch-icon">
  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      background-color: var(--color-scheme-1--background);
    }

    .e404 {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    .e404__intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .e404__logo {
      max-height: 120px;
      width: auto;
    }

    .e404__rule {
      width: 56px;
      height: 1px;
      background-color: var(--color-scheme-1--border);
      opacity: .55;
    }

    .e404__eyebrow {
      margin: 0;
      color: var(--color-scheme-1--accent);
      font-family: Montserrat, Arial, sans-serif;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-right: -4px;
    }

    .e404__title {
      margin: 0;
      color: var(--color-scheme-1--accent);
      font-family: "Libre Caslon Display", Georgia, serif;
      font-size: 44px;
      line-height: 1.15;
      font-weight: 400;
    }

    .e404__text {
      margin: 0;
      max-width: 44ch;
      color: var(--color-scheme-1--text);
      font-family: "Libre Caslon Display", Georgia, serif;
      font-size: 20px;
      line-height: 1.5;
    }

    .e404__button {
      color: var(--color-scheme-1--foreground);
      background-color: var(--color-scheme-1--accent);
      border: 2px solid var(--color-scheme-1--accent);
      padding: 12px 35px;
      font-family: Satoshi, Arial, sans-serif;
      font-size: 18px;
      line-height: 24px;
      text-decoration: none;
      display: block;
      transition: color 200ms ease, background-color 200ms ease, transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    .e404__button:active {
      transform: scale(0.97);
    }

    .e404__button:focus-visible {
      outline: 2px solid var(--color-scheme-1--border);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .e404__button:hover {
        color: var(--color-scheme-1--accent);
        background-color: var(--color-scheme-1--foreground);
      }
    }

    @media (max-width: 767px) {
      .e404__title {
        font-size: 34px;
      }

      .e404__text {
        font-size: 18px;
      }

      .e404__button {
        font-size: 16px;
        padding: 10px 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .e404__button:active {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="e404">
    <div class="e404__intro">
      <img src="images/monograma-j-n-verde.png" alt="Juan y Nancy" class="e404__logo">
      <span class="e404__rule" aria-hidden="true"></span>
      <p class="e404__eyebrow">Error 404</p>
    </div>
    <h1 class="e404__title">Esta página no existe</h1>
    <p class="e404__text">Puede que el enlace esté incompleto o que la página se haya movido.</p>
    <a href="/" class="e404__button">Volver a la invitación</a>
  </main>
</body>

</html>
